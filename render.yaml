services:
  - type: web
    name: staffing-risk-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agent.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: HEARTBEAT_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: staffing-agent-db
          property: connectionString

databases:
  - name: staffing-agent-db
    plan: free

# NOTA: el cron semanal se removió porque Render ya no ofrece free tier para
# cron jobs. El agente se gatilla vía POST /run (suficiente para la evaluación).
# En producción el schedule iría en EventBridge (AWS), como dice el decision log.
