services:
  - type: web
    name: staffing-risk-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agent.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: staffing-agent-db
          property: connectionString

  - type: cron
    name: staffing-risk-agent-weekly
    runtime: python
    plan: free
    schedule: "0 12 * * 1"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m agent.main
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: staffing-agent-db
          property: connectionString

databases:
  - name: staffing-agent-db
    plan: free
